<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Family Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1914;
    --text: #c4bba8;
    --text-strong: #d4ccb8;
    --muted: #6a6050;
    --rule: #2e2a22;
    --cell-bg: #221e18;
    --cell-empty: rgba(255,255,255,0.04);
    --indicator: #c4bba8;
  }
  :root[data-theme="light"] {
    --bg: #f5f0e6;
    --text: #2c2825;
    --text-strong: #1a1816;
    --muted: #8a8580;
    --rule: #e8e0d0;
    --cell-bg: #ede6d8;
    --cell-empty: rgba(0,0,0,0.04);
    --indicator: #2c2825;
  }

  /* View Transitions API: when render() wraps DOM changes in
     document.startViewTransition, the browser cross-fades the snapshots of
     named elements. Tune the duration/easing here. Elements with a matching
     `view-transition-name` in old and new DOM morph position+size; unmatched
     ones fade in/out. */
  ::view-transition-group(*) {
    animation-duration: 0.32s;
    animation-timing-function: cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  /* Tone down fade-in/out so added/removed items don't pop harshly. */
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation-duration: 0.28s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Newsreader', Georgia, serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: background 0.2s, color 0.2s;
    --label-w: clamp(140px, 14vw, 220px);
    --row-gap: 4px;
    --col-gap: 3px;
    --pad-x: 16px;
    --pad-y: 14px;
    --chr-h: clamp(28px, 4vh, 42px);
  }
  .desktop-layout {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: var(--pad-y) var(--pad-x);
    gap: 8px;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .grid-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-rows: var(--chr-h) 1fr;
    gap: var(--row-gap);
  }
  .chr { display: flex; align-items: center; gap: 0; }
  .lbl {
    width: var(--label-w);
    flex-shrink: 0;
    padding-right: 14px;
    text-align: right;
  }
  .lbl span { font-size: 10px; color: var(--muted); }
  .cells {
    flex: 1 1 0;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: var(--col-gap);
    min-width: 0;
  }
  .chr-c {
    display: flex; align-items: center; justify-content: center;
    min-width: 0;
  }
  .chr-c span { font-size: clamp(11px, 1.4vh, 14px); color: var(--muted); letter-spacing: 0.3px; }

  .rows {
    display: grid;
    gap: var(--row-gap);
    min-height: 0;
    overflow: hidden;
  }

  /* --- Add row: same height as a scale row, no layout shift between states.
         Collapsed: circled + sits at horizontal center of the row.
         Expanded:  the same + (now ×) slides left to align with scale-name column;
                    pills fill the notes area. --- */
  .row-add {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 0;
    min-width: 0;
  }
  /* Position the button directly via `left` so the transition moves it smoothly
     from the row's horizontal center to the info column's horizontal center
     (same axis as the scale names). Both endpoints are `calc()`-expressible. */
  .row-add .add-toggle-wrap {
    position: absolute;
    top: 50%;
    height: clamp(34px, 5vh, 52px);
    z-index: 2;
    pointer-events: none;
    transition: left 0.32s cubic-bezier(0.4, 0.0, 0.2, 1),
                transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  .row-add.collapsed .add-toggle-wrap {
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .row-add.expanded .add-toggle-wrap {
    /* Center within the info column (same horizontal center as scale names).
       Info column width is var(--label-w); its right edge has 14px padding,
       so its visual center sits at (var(--label-w) - 14px) / 2. */
    left: calc((var(--label-w) - 14px) / 2);
    transform: translate(-50%, -50%);
  }
  .row-add .add-toggle {
    width: clamp(34px, 5vh, 52px);
    height: clamp(34px, 5vh, 52px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    background: none;
    border: 1.5px solid var(--muted);
    border-radius: 50%;
    color: var(--muted);
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(18px, 2.4vh, 26px);
    font-weight: 300;
    line-height: 1;
    padding: 0;
    transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-origin: 50% 50%;
  }
  .row-add .add-toggle:hover {
    color: var(--text-strong);
    border-color: var(--text);
    background: var(--cell-empty);
  }
  .row-add.expanded .add-toggle {
    color: var(--text);
    border-color: var(--text);
    transform: rotate(45deg);
  }
  .add-body {
    margin-left: var(--label-w);
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(3px, 0.5vh, 6px);
    min-width: 0;
    min-height: 0;
    padding: 4px 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.2s ease 0.15s;
  }
  .row-add.expanded .add-body { opacity: 1; }
  .row-add.collapsed .add-body { pointer-events: none; }
  .pill-row {
    display: flex;
    align-items: center;
    gap: 0;
    min-width: 0;
    white-space: nowrap;
  }
  .pill-row.vertical {
    align-items: stretch;
    flex: 1 1 auto;
    min-height: 0;
  }
  .pill-row.vertical .pill-group {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 8px 6px 8px;
    margin: 0 10px;
    white-space: normal;
    overflow: visible;
  }
  .pill-row.vertical .pill {
    font-size: clamp(14px, 1.8vh, 18px);
    padding: 3px 10px;
    overflow: visible;
    text-overflow: clip;
    flex: 0 0 auto;
  }
  .grp-labels {
    display: flex;
    gap: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(8px, 0.95vh, 10px);
    text-transform: uppercase;
    letter-spacing: 1.6px;
    color: var(--muted);
    opacity: 0.75;
    white-space: nowrap;
  }
  .pill-group {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 0;
    min-width: 0;
    border-bottom: 1px solid var(--muted);
    padding: 0 4px 3px 4px;
    margin: 0 6px;
    gap: 2px;
    overflow: hidden;
  }
  .pill-group:first-child { margin-left: 0; }
  .pill-group:last-child { margin-right: 0; }
  .grp-label {
    flex: 1 1 0;
    text-align: center;
    padding-top: 3px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill {
    background: none;
    border: none;
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(11px, 1.4vh, 13px);
    font-weight: 600;
    padding: 2px 5px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.12s, opacity 0.15s;
    line-height: 1.15;
    white-space: nowrap;
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill:hover { background: var(--cell-empty); }
  .pill.used {
    opacity: 0.3;
    cursor: default;
  }
  .pill.used:hover { background: none; }

  .row {
    display: flex; align-items: stretch;
    transition: opacity 0.15s ease, box-shadow 0.1s;
    touch-action: pan-y;
    min-height: 0;
    min-width: 0;
    position: relative;
  }
  .row:hover { z-index: 2; }
  .row.dragging { opacity: 0.35; }
  .row.drop-before { box-shadow: 0 -2px 0 0 var(--indicator); }
  .row.drop-after { box-shadow: 0 2px 0 0 var(--indicator); }

  .info {
    width: var(--label-w);
    flex-shrink: 0;
    padding-right: 14px;
    text-align: center;
    cursor: grab;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }
  .row.dragging .info { cursor: grabbing; }
  .info-top {
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .sname {
    font-size: clamp(18px, 2.2vh, 28px);
    font-weight: 600;
    line-height: 1.1;
  }
  .sform {
    font-size: clamp(10px, 1.2vh, 13px);
    color: var(--muted);
    letter-spacing: 0.2px;
    margin-top: 3px;
  }

  .rmv, .inf {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid var(--muted);
    background: none; cursor: pointer;
    color: var(--muted); font-size: 13px; line-height: 1;
    padding: 0; margin: 0;
    font-family: inherit; font-weight: 400;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
  }
  .rmv > span, .inf > span { transform: translateY(-0.5px); }
  .rmv { opacity: 0; }
  .row:hover .rmv { opacity: 0.7; }
  .rmv:hover {
    opacity: 1; color: var(--text-strong);
    border-color: var(--text); background: var(--cell-empty);
  }
  .inf {
    opacity: 0.55;
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic; font-weight: 700;
    font-size: 11px;
    position: relative;
  }
  .inf:hover, .inf:focus {
    opacity: 1; color: var(--text-strong);
    border-color: var(--text); background: var(--cell-empty);
    outline: none;
  }
  .inf::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 300px;
    padding: 9px 12px;
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    background: var(--cell-bg);
    border: 1px solid var(--rule);
    border-radius: 5px;
    white-space: normal;
    text-align: left;
    letter-spacing: 0;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.12s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  .inf:hover::after, .inf:focus::after {
    opacity: 1;
    visibility: visible;
  }

  .nc {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s ease;
    background: transparent;
    position: relative;
    min-width: 0;
  }
  .nc:hover { transform: scale(1.04); z-index: 1; }
  .nc .nn {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(18px, 3vh, 36px);
    line-height: 1;
  }
  .nc .nd {
    font-size: clamp(10px, 1.4vh, 15px);
    margin-top: 4px;
    line-height: 1;
  }

  .nw {
    position: relative;
    min-width: 0;
    display: flex;
  }
  .a2 {
    position: absolute; top: -9px;
    left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-size: 9px;
    z-index: 10;
    background: var(--bg);
    padding: 0 2px;
    margin: 0 auto;
    width: fit-content;
    line-height: 1;
  }
  .bend-arrow {
    position: absolute;
    top: 50%;
    right: -5px;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 2;
    font-size: 8px;
    line-height: 1;
    opacity: 0.6;
  }

  /* Default: show desktop, hide portrait. Portrait rules below override when triggered. */
  .portrait-layout { display: none; }

  /* --- Portrait (vertical) layout — fills viewport, scales as columns --- */
  @media (max-width: 700px), (max-aspect-ratio: 4/5) {
    .desktop-layout { display: none; }
    .portrait-layout {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px 8px;
      gap: 6px;
    }
    .t-grid {
      flex: 1 1 auto;
      display: grid;
      gap: 2px;
      min-height: 0;
      grid-template-rows: repeat(12, 1fr) auto auto auto;
    }
    .t-note-row { display: contents; }
    .t-nlbl {
      grid-column: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(11px, 1.8vh, 15px);
      color: var(--muted);
      min-height: 0;
    }
    .t-cell {
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      transition: opacity 0.15s, box-shadow 0.1s;
      touch-action: pan-y;
      min-width: 0; min-height: 0;
    }
    .t-dot {
      width: 55%;
      aspect-ratio: 1;
      max-width: 28px;
      border-radius: 50%;
    }
    .t-dot-root {
      width: 70%;
      aspect-ratio: 1;
      max-width: 34px;
      border-radius: 50%;
    }
    .t-rmv-cell, .t-inf-cell {
      display: flex; align-items: center; justify-content: center;
      min-height: 22px;
      max-height: 26px;
    }
    .t-rmv-cell .rmv { width: 20px; height: 20px; font-size: 14px; opacity: 0.55; }
    .t-rmv-cell .rmv:hover { opacity: 1; }
    .t-inf-cell .inf { width: 20px; height: 20px; font-size: 13px; }
    /* On portrait, anchor tooltip to the viewport so it can't be clipped by
       the column's position. position:fixed escapes any transform/overflow
       ancestor; left/right pin it to the viewport edges. */
    .t-inf-cell .inf::after {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: auto;
      width: auto;
      max-width: none;
      transform: none;
      font-size: 12px;
    }
    body { overflow-x: clip; }
    .t-hdr {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2px 0;
      cursor: pointer;
      line-height: 1.15;
      transition: opacity 0.15s, box-shadow 0.1s;
      touch-action: pan-y;
      min-height: 36px;
      max-height: 56px;
    }
    .t-hdr-name {
      font-size: clamp(10px, 1.4vh, 13px);
      font-weight: 600;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .t-col-dragging { opacity: 0.35; }
    .t-col-drop-before { box-shadow: -2px 0 0 0 var(--indicator); }
    .t-col-drop-after { box-shadow: 2px 0 0 0 var(--indicator); }

    /* Add column toggle: the .t-add-hdr spans from header row through all 12
       note rows. Button is absolutely positioned within it:
         collapsed → centered vertically (so it hovers over the empty notes area)
         expanded  → top (aligned with scale name row)
       Animating `top` gives a smooth slide. */
    .t-add-hdr {
      position: relative;
      pointer-events: none;
      z-index: 3;
    }
    .t-add-hdr .add-toggle {
      position: absolute;
      left: 50%;
      width: clamp(30px, 5vh, 40px);
      height: clamp(30px, 5vh, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      color: var(--muted);
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(18px, 2.6vh, 24px);
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      pointer-events: auto;
      transform-origin: 50% 50%;
      transition: color 0.2s, border-color 0.2s, background 0.2s,
                  top 0.32s cubic-bezier(0.4, 0.0, 0.2, 1),
                  transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .t-add-hdr.collapsed .add-toggle {
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .t-add-hdr.expanded .add-toggle {
      top: 6px;
      transform: translateX(-50%) rotate(45deg);
      color: var(--text);
      border-color: var(--text);
    }
    .t-add-hdr .add-toggle:hover {
      color: var(--text-strong);
      border-color: var(--text);
      background: var(--cell-empty);
    }

    /* Expanded picker: pills stacked HORIZONTALLY with vertical text inside
       the add column; groups stack top-to-bottom along the note-rows axis,
       each group separated by a right-side vertical rule with the group
       label alongside running vertically (mirror of landscape's
       vertical-pill columns separated by bottom rules with horizontal labels). */
    .t-pill-group {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
      column-gap: 4px;
      min-height: 0;
      min-width: 0;
      padding: 2px 0;
      overflow: hidden;
    }
    .t-pill-row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: stretch;
      gap: 2px;
      border-right: 1px solid var(--muted);
      padding-right: 4px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .t-pill-row .pill {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: clamp(10px, 1.4vh, 13px);
      padding: 4px 2px;
      line-height: 1.15;
      flex: 0 1 auto;
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .t-pill-group.dim .t-pill-row { opacity: 0.35; }
    .t-grp-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(7px, 0.9vh, 9px);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      opacity: 0.75;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      align-self: center;
    }
    .t-pill-group.dim .t-grp-label { opacity: 0.35; }

    /* Flat / compact fallback: one flex-wrap row of vertical-text pills
       filling the entire picker area. Used when the grouped layout can't
       fit all unused pills. By default the flat version is hidden; the
       measurement pass in updatePickerCompactness() toggles .compact on
       the t-grid to swap them. */
    .t-pill-flat {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      align-items: stretch;
      gap: 2px 4px;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      padding: 2px 0;
    }
    .t-pill-flat .pill {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: clamp(10px, 1.4vh, 13px);
      padding: 4px 2px;
      line-height: 1.15;
      flex: 0 1 auto;
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .t-grid:not(.compact) .t-pill-flat { display: none; }
    .t-grid.compact .t-pill-group { display: none; }

    .desktop-layout { display: none; }
    .portrait-layout { display: flex; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const N=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const P={C:"C",Db:"D♭",D:"D",Eb:"E♭",E:"E",F:"F",Gb:"G♭",G:"G",Ab:"A♭",A:"A",Bb:"B♭",B:"B"};
const DG={0:"1",1:"♭2",2:"2",3:"♭3",4:"3",5:"4",6:"♭5",7:"5",8:"♭6",9:"6",10:"♭7",11:"7"};

// Grouping rationale: music theory. Pentatonic (5-note) and Blues (6-note,
// with characteristic blue note) are small-set structural families. The two
// heptatonic groups split on whether the scale contains an augmented-2nd
// interval — the single most audible structural feature in this visualization.
// "Diatonic" = 7 notes, no aug 2 (church modes + major/minor).
// "Harmonic" = 7 notes, with one or two aug 2s (Near-Eastern / maqam flavor).
const PG_P="Pentatonic", PG_B="Blues", PG_D="Diatonic", PG_H="Harmonic";

// Colors from the Flexoki palette (kepano/flexoki). Hue is chosen for musical
// feel — warm (yellow/orange/red) for major-3rd or high-tension scales, cool
// (green/cyan/blue/purple) for minor-3rd / diatonic modes, magenta/red for
// maximum-tension scales with aug-2nd or blue-note intervals.
const S={
  // Pentatonic (5 notes)
  major_pent: {n:"Major Pentatonic", iv:[0,2,4,7,9],       f:"1 2 3 5 6",        g:PG_P, c:{light:"#66800B",dark:"#879A39"},
               ref:"Near-universal folk scale: Chinese 宮 gōng-mode, Celtic airs, African traditional, shape-note hymnody."},
  minor_pent: {n:"Minor Pentatonic", iv:[0,3,5,7,10],      f:"1 ♭3 4 5 ♭7",     g:PG_P, c:{light:"#BC5215",dark:"#DA702C"},
               ref:"Ubiquitous in blues, rock, and R&B. Chinese 羽 yǔ-mode — the default pentatonic of most Chinese folk and much Chinese indie/rock."},
  yo:         {n:"Yo 陽",            iv:[0,2,5,7,9],       f:"1 2 4 5 6",        g:PG_P, c:{light:"#AD8301",dark:"#D0A215"},
               ref:"Japanese “bright” pentatonic. Anhemitonic — no semitones. Min'yō folk song, Shinto ritual. A rotation of the Major Pentatonic."},

               ref:"岩戸, named for Amano-Iwato, the cave of the sun goddess Amaterasu. The darkest koto scale."},
  // Blues (6 notes, with blue-note inflections)
  major_blues:{n:"Major Blues",      iv:[0,2,3,4,7,9],     f:"1 2 ♭3 3 5 6",    g:PG_B, c:{light:"#AD8301",dark:"#D0A215"}, borrowed:[6,10],
               ref:"Country blues (Snooks Eaglin), Southern folk, bluegrass, Americana. The ♭3 bends up to the 3 — a hallmark of early blues vocal style."},
  minor_blues:{n:"Minor Blues",      iv:[0,3,5,6,7,10],    f:"1 ♭3 4 ♭5 5 ♭7",  g:PG_B, c:{light:"#5E409D",dark:"#8B7EC8"},
               ref:"Chicago and Delta blues, classic blues, blues-rock. The ♭5 “blue note” sits between ♭3 and 5 — the classic tension of the form."},

  lydian:     {n:"Lydian",           iv:[0,2,4,6,7,9,11],  f:"1 2 3 ♯4 5 6 7",   g:PG_D, c:{light:"#24837B",dark:"#3AA99F"},
               ref:"The brightest church mode — the ♯4 gives it a floating, open quality. The harmonic home of ECM-era modal jazz (Metheny, Jarrett, Anouar Brahem), Nils Frahm-style neo-classical ambient, and much minimalism."},

  mixolydian: {n:"Mixolydian",       iv:[0,2,4,5,7,9,10],  f:"1 2 3 4 5 6 ♭7",   g:PG_D, c:{light:"#BC5215",dark:"#DA702C"},
               ref:"Major with a flat 7 — the sound of bluegrass fiddle tunes, Appalachian modal folk, Irish/Scottish pipe music, and New Orleans R&B (Allen Toussaint, Snooks Eaglin). Dominant-seventh feel without resolving."},
  dorian:     {n:"Dorian",           iv:[0,2,3,5,7,9,10],  f:"1 2 ♭3 4 5 6 ♭7",  g:PG_D, c:{light:"#66800B",dark:"#879A39"},
               ref:"Minor with a raised 6 — neither dark nor bright. Celtic and Scottish folk (Dead South adjacent), modal jazz (So What, Impressions), bluegrass modal tunes, and much of what your Dylan / folk-rock / bluegrass ear gravitates toward."},
  nat_minor:  {n:"Natural Minor",    iv:[0,2,3,5,7,8,10],  f:"1 2 ♭3 4 5 ♭6 ♭7", g:PG_D, c:{light:"#AF3029",dark:"#D14D41"},
               ref:"Aeolian church mode. Default minor of Russian, Armenian, and Greek folk song. Pervasive in fado (Dead Combo, Lhasa), DakhaBrakha, and Slavic/Balkan folk."},
  phrygian:   {n:"Phrygian",         iv:[0,1,3,5,7,8,10],  f:"1 ♭2 ♭3 4 5 ♭6 ♭7", g:PG_D, c:{light:"#5E409D",dark:"#8B7EC8"},
               ref:"maqam Kurd (Arabic). Gregorian Mode III. The ♭2 gives flamenco its signature descent (Rodrigo y Gabriela) and colors Anouar Brahem's oud and Lhasa's darker songs."},
  mel_minor:  {n:"Melodic Minor",    iv:[0,2,3,5,7,9,11],  f:"1 2 ♭3 4 5 6 7",   g:PG_D, c:{light:"#A02F6F",dark:"#CE5D97"},
               ref:"Minor tetrachord below, major tetrachord above — no aug 2nd. Parent scale of bebop and post-bop jazz (its modes give altered, lydian dominant, locrian ♮2). The harmonic grammar underneath hard bop, cool jazz, Marcus Roberts's modern stride, and Henri Texier's French jazz."},
  // Harmonic (7 notes, one or two aug 2s — Near-Eastern / maqam)
  harm_minor: {n:"Harmonic Minor",   iv:[0,2,3,5,7,8,11],  f:"1 2 ♭3 4 5 ♭6 7",  g:PG_H, c:{light:"#AF3029",dark:"#D14D41"},
               ref:"Armenian folk, klezmer, Spanish flamenco, Eastern-European Romani. Gurdjieff's “favourite mode” (per James Moore) — also the backbone of much Hermanos Gutiérrez and Rabih Abou-Khalil."},
  neap_minor: {n:"Neapolitan Minor", iv:[0,1,3,5,7,8,11],  f:"1 ♭2 ♭3 4 5 ♭6 7", g:PG_H, c:{light:"#A02F6F",dark:"#CE5D97"},
               ref:"Phrygian lower tetrachord + harmonic-minor upper tetrachord. Rare in popular music; surfaces in Romantic classical (Chopin, Liszt) and occasionally in Near-Eastern art-music rotations."},
  hijaz:      {n:"Hijaz",            iv:[0,1,4,5,7,8,10],  f:"1 ♭2 3 4 5 ♭6 ♭7", g:PG_H, c:{light:"#AD8301",dark:"#D0A215"},
               ref:"maqam Hijaz (Arabic). Phrygian dominant (jazz). Freygish (klezmer). The core sound of Sufi qawwali (Dhafer Youssef, Shye Ben Tzur), flamenco cadences, Rabih Abou-Khalil's oud jazz, and Gurdjieff's Sayyid and Dervish dances."},
  dbl_harm:   {n:"Double Harmonic",  iv:[0,1,4,5,7,8,11],  f:"1 ♭2 3 4 5 ♭6 7",  g:PG_H, c:{light:"#AF3029",dark:"#D14D41"},
               ref:"maqam Hijaz Kar (Arabic). Byzantine scale. Bhairav (Hindustani). Two augmented-2nd intervals."},
  hung_minor: {n:"Hungarian Minor",  iv:[0,2,3,6,7,8,11],  f:"1 2 ♭3 ♭5 5 ♭6 7", g:PG_H, c:{light:"#BC5215",dark:"#DA702C"},
               ref:"Hungarian Gypsy / Romani scale. The raised 4th gives a sharper, more restless color than Harmonic Minor — heard in Liszt's Hungarian Rhapsodies and Eastern-European film scoring."},
};

const DEFAULTS={
  major_pent:"C", minor_pent:"A", yo:"D", in:"D", hirajoshi:"D", iwato:"E",
  major_blues:"C", minor_blues:"A",
  lydian:"F", major:"C", mixolydian:"G", dorian:"D", nat_minor:"A", phrygian:"E", mel_minor:"A",
  harm_minor:"A", neap_minor:"D", hijaz:"E", dbl_harm:"D", hung_minor:"D"
};

const BLUE_NOTES={ minor_blues:[3,6,10], major_blues:[3] };

let theme='dark';
let order=[];
let roots={};
Object.keys(S).forEach(k=>roots[k]=DEFAULTS[k]);
let pickerOpen=false;

function scaleColor(k){return S[k].c[theme];}

/* --- Theme --- */
function detectTheme(){
  try{
    if(window.parent&&window.parent!==window){
      const t=window.parent.document.documentElement.getAttribute('data-theme');
      if(t==='light'||t==='dark') return t;
    }
  }catch(e){}
  return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function applyTheme(){
  theme=detectTheme();
  document.documentElement.setAttribute('data-theme',theme);
  render();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
try{
  if(window.parent&&window.parent!==window){
    new MutationObserver(applyTheme).observe(
      window.parent.document.documentElement,
      {attributes:true,attributeFilter:['data-theme']}
    );
  }
}catch(e){}

/* --- State --- */
function loadState(){
  const p=new URLSearchParams(location.search);
  const a=p.get('a');
  if(a!==null){
    order=a.split(',').filter(k=>S[k]);
  }
  const r=p.get('r');
  if(r) r.split(',').forEach(s=>{
    const[k,v]=s.split(':');
    if(S[k]&&N.includes(v)) roots[k]=v;
  });
}
function saveState(){
  const p=new URLSearchParams();
  if(order.length) p.set('a',order.join(','));
  const rParts=[];
  order.forEach(k=>{ if(roots[k]!==DEFAULTS[k]) rParts.push(k+':'+roots[k]); });
  if(rParts.length) p.set('r',rParts.join(','));
  const qs=p.toString();
  history.replaceState(null,'',qs?'?'+qs:location.pathname);
}
loadState();
if(order.length===0) pickerOpen=true;

/* --- Music helpers --- */
function sn(root,iv){const ri=N.indexOf(root);return iv.map(i=>N[(ri+i)%12]);}
// Returns an array of [lo,hi] iv pairs where an augmented-2nd (3-semitone) gap
// occurs between adjacent scale degrees. Computed from the interval set.
function a2(k){
  const iv=S[k].iv, out=[];
  for(let i=0;i<iv.length;i++){
    const next=(i===iv.length-1)?12:iv[i+1];
    if(next-iv[i]===3) out.push([iv[i],next===12?0:next]);
  }
  return out.length?out:null;
}
function isBlueNote(iv,k){return BLUE_NOTES[k]&&BLUE_NOTES[k].includes(iv);}
function getBorrowed(k,root){
  const sc=S[k]; if(!sc.borrowed) return {};
  const ri=N.indexOf(root);
  const map={}; sc.borrowed.forEach(iv=>{map[N[(ri+iv)%12]]=iv;});
  return map;
}

/* --- Rendering --- */
function renderRowDesktop(k){
  const sc=S[k],root=roots[k],notes=sn(root,sc.iv),augs=a2(k);
  const borrowed=getBorrowed(k,root);
  const sc_c=scaleColor(k);

  const hasRef=!!sc.ref;

  let h=`<div class="row" data-k="${k}" style="view-transition-name:row-${k}"><div class="info">
    <div class="info-top">
      <button class="rmv" data-rmv="${k}" aria-label="Remove ${sc.n}"><span>×</span></button>
      <span class="sname" style="color:${sc_c}">${sc.n}</span>${hasRef?`
      <button class="inf" data-tip="${sc.ref.replace(/"/g,'&quot;')}" aria-label="About ${sc.n}"><span>i</span></button>`:""}
    </div>
    <div class="mono sform">${sc.f}</div>
  </div><div class="cells">`;

  for(let i=0;i<N.length;i++){
    const note=N[i];
    const inS=notes.includes(note);
    const si=inS?notes.indexOf(note):-1;
    const iv=inS?sc.iv[si]:null;
    const bl=inS&&isBlueNote(iv,k);
    const isR=note===root;
    const isA2=augs?augs.some(p=>inS&&iv===p[0]):false;
    const isBorrowed=!inS&&borrowed[note]!==undefined;
    const borrowedIv=isBorrowed?borrowed[note]:null;

    let bg,bd;
    if(inS){
      if(bl){
        bg=`repeating-linear-gradient(135deg,${sc_c}18,${sc_c}18 3px,${sc_c}30 3px,${sc_c}30 6px)`;
        bd=`1.5px dashed ${sc_c}88`;
      }else if(isR){
        bg=`${sc_c}44`;bd=`2px solid ${sc_c}`;
      }else{
        bg=`${sc_c}20`;bd=`1px solid ${sc_c}50`;
      }
    }else if(isBorrowed){
      bg=`var(--cell-bg)`;bd=`1px dotted ${sc_c}45`;
    }else{
      bg="transparent";bd=`1px solid var(--cell-empty)`;
    }

    const nc=bl?sc_c:isR?"var(--text-strong)":isBorrowed?`${sc_c}aa`:"var(--text)";
    const dc=bl?sc_c:isBorrowed?`${sc_c}70`:"var(--muted)";
    const fw=isR?700:500;

    h+=`<div class="nw">`;
    if(isA2) h+=`<div class="a2 mono" style="color:${sc_c}">aug 2</div>`;
    h+=`<div class="nc" style="background:${bg};border:${bd}" data-r="${k}:${note}">`;
    if(inS){
      h+=`<span class="nn" style="color:${nc};font-weight:${fw}">${P[note]}</span>`;
      h+=`<span class="mono nd" style="color:${dc}">${DG[iv]}</span>`;
    }else if(isBorrowed){
      h+=`<span class="nn" style="color:${nc};font-weight:400;opacity:0.65">${P[note]}</span>`;
      h+=`<span class="mono nd" style="color:${dc};opacity:0.65">${DG[borrowedIv]}</span>`;
    }
    h+=`</div></div>`;
  }
  h+=`</div></div>`;
  return h;
}

// Shared picker model used by both layouts: 4 groups, sorted by brightness within each.
const PICKER_GROUPS = [
  {g:PG_P, lbl:'pentatonic'},
  {g:PG_B, lbl:'blues'},
  {g:PG_D, lbl:'diatonic'},
  {g:PG_H, lbl:'harmonic'},
];
function pickerGroups(){
  const byGroup=new Map(PICKER_GROUPS.map(x=>[x.g,[]]));
  for(const k of Object.keys(S)) byGroup.get(S[k].g).push(k);
  byGroup.forEach(arr=>arr.sort((a,b)=>brightnessOf(a)-brightnessOf(b)));
  return {groups:PICKER_GROUPS, byGroup};
}
function abbrScale(n){
  return n
    .replace('Pentatonic','Pent')
    .replace('Natural ','Nat ')
    .replace('Harmonic ','Harm ')
    .replace('Melodic ','Mel ')
    .replace('Neapolitan ','Neap ')
    .replace('Hungarian ','Hung ')
    .replace('Double ','Dbl ')
    .replace('Major ','Maj ')
    .replace('Minor ','Min ');
}
function pillButton(k, full){
  const used=order.includes(k);
  const col=scaleColor(k);
  const label=used?`${S[k].n} (in tree)`:`Add ${S[k].n}`;
  const text=full?S[k].n:abbrScale(S[k].n);
  // view-transition-name per pill so when a scale is added, its pill animates
  // from picker position → scale-row position (or fades if not shared).
  return `<button class="pill${used?' used':''}" ${used?'':`data-add="${k}"`} style="color:${col};view-transition-name:pill-${k}" aria-label="${label}" title="${S[k].n}">${text}</button>`;
}

function renderAddZone(){
  // Landscape add row. When expanded, pills stack vertically per group and
  // used scales are filtered out (they already appear in the scale grid).
  // Pills always sit right of the label column, so the add panel doesn't
  // shift horizontally between empty and non-empty states.
  const empty = order.length === 0;
  const classes = ['row-add'];
  classes.push(pickerOpen ? 'expanded' : 'collapsed');
  let h = `<div class="${classes.join(' ')}">`;
  if(!empty){
    h += `<div class="add-toggle-wrap">
      <button class="add-toggle" data-add-toggle="d" aria-label="${pickerOpen?'Close':'Add scale'}">+</button>
    </div>`;
  }
  h += `<div class="add-body">`;
  if(pickerOpen){
    h += buildLandscapePickerBody();
  }
  h += `</div></div>`;
  return h;
}

// Shared across landscape + portrait picker renders. Returns the picker
// groups plus which scales within each group are still unused (i.e. not
// already in `order`). `hasAny` short-circuits the "all scales in tree" case.
function pickerPartition(){
  const {groups,byGroup}=pickerGroups();
  const unusedByGroup = new Map();
  let hasAny = false;
  groups.forEach(grp=>{
    const unused=byGroup.get(grp.g).filter(k=>!order.includes(k));
    unusedByGroup.set(grp.g, unused);
    if(unused.length) hasAny = true;
  });
  return {groups, byGroup, unusedByGroup, hasAny};
}

function buildLandscapePickerBody(){
  // Pills stack vertically per group. Used scales are excluded — only unused
  // scales appear. A group with no unused scales collapses to nothing (but the
  // label still shows as a reference so the visual layout stays stable).
  const {groups,byGroup,unusedByGroup,hasAny}=pickerPartition();
  let h = `<div class="pill-row vertical">`;
  groups.forEach((grp)=>{
    const unused = unusedByGroup.get(grp.g);
    // Keep a flex-weight proportional to the original pill count so group labels
    // below still align under a reasonable column even if the group is empty.
    const originalN = byGroup.get(grp.g).length;
    h += `<div class="pill-group" style="flex:${originalN} 1 0">`;
    for(const k of unused) h += pillButton(k, true);
    h += `</div>`;
  });
  h += `</div>`;
  h += `<div class="grp-labels">`;
  groups.forEach((grp)=>{
    const originalN = byGroup.get(grp.g).length;
    const unused = unusedByGroup.get(grp.g);
    const dim = unused.length === 0 ? 'opacity:0.35' : '';
    h += `<div class="grp-label" style="flex:${originalN} 1 0;${dim}">${grp.lbl}</div>`;
  });
  h += `</div>`;
  if(!hasAny){
    // Edge case: all scales are already in the tree.
    h = `<div class="pill-row vertical"><div class="grp-label" style="flex:1 1 0;text-align:center;padding:20px 0">all scales in the tree</div></div>`;
  }
  return h;
}

function renderDesktop(){
  // When the picker is expanded the add row grows to fit the vertical pill stacks,
  // which can push scale rows to share remaining space. When collapsed the add row
  // stays at 1fr like the other rows.
  const empty = order.length === 0;
  let rowsTemplate;
  if(empty){
    rowsTemplate = `1fr`;
  } else if(pickerOpen){
    rowsTemplate = `repeat(${order.length}, minmax(0, 1fr)) minmax(min-content, 1fr)`;
  } else {
    rowsTemplate = `repeat(${order.length + 1}, 1fr)`;
  }
  let h=`<div class="grid-wrap">
    <div class="chr">
      <div class="lbl"><span class="mono">chromatic</span></div>
      <div class="cells">${N.map(n=>`<div class="chr-c"><span class="mono">${P[n]}</span></div>`).join("")}</div>
    </div>
    <div class="rows" id="rows-d" style="grid-template-rows:${rowsTemplate}">`;
  for(const k of order) h+=renderRowDesktop(k);
  h+=renderAddZone();
  h+=`</div></div>`;
  return h;
}

function renderPortrait(){
  // Portrait = rotated landscape. Scale columns mirror landscape's scale rows.
  // Column-internal order (top → bottom) matches landscape's row-internal order
  // (right → left of info column):
  //   row 1: × remove button
  //   row 2: scale name
  //   row 3: ⓘ info button
  //   rows 4..15: 12 notes (B high → C low)
  //
  // Add column sits on the right (mirror of landscape's add row on the bottom).
  // When the picker is expanded, it contains horizontally-stacked pills with
  // vertical text (mirror of landscape's vertically-stacked horizontal pills).
  let h='';
  const nCols = order.length;
  const empty = nCols === 0;
  // Row template: × row (24px), header row (42px), ⓘ row (24px), 12 note rows (1fr each).
  // Fixed heights for the 3 header rows so the chromatic column's note rows
  // stay at the same vertical positions regardless of empty state — the
  // chromatic reference only moves horizontally, never vertically.
  const rowsTemplate = `24px 42px 24px repeat(12, minmax(0,1fr))`;
  h+=`<div class="t-grid" id="t-grid" style="grid-template-columns:36px repeat(${nCols},minmax(0,1fr)) minmax(0,1fr);grid-template-rows:${rowsTemplate}">`;

  const addCol = nCols + 2; // 1 note-label + nCols scale cols + 1 add col
  // Row 1: × remove buttons on top of each scale column (the add column's
  // t-add-hdr covers the add-column cell).
  h+=`<div></div>`;
  for(let ci=0;ci<nCols;ci++){
    const k=order[ci];
    h+=`<div class="t-rmv-cell" data-col-k="${k}"><button class="rmv" data-rmv="${k}" aria-label="Remove ${S[k].n}"><span>×</span></button></div>`;
  }
  // The add header is explicitly placed in the add column spanning from the
  // × row through the 12 note rows (rows 1..16). Emitted in both states so
  // the grid geometry (and thus the chromatic column's row heights) stays
  // identical between empty and non-empty — the chromatic reference only
  // moves horizontally as scale columns are added/removed.
  //
  // The toggle button inside is absolutely positioned and animates vertically
  // between collapsed-center and expanded-top. In the empty state there's no
  // scale to close back to, so we omit the button itself.
  h+=`<div class="t-add-hdr ${pickerOpen?'expanded':'collapsed'}" style="grid-column:${addCol};grid-row:1 / 16">`;
  if(!empty){
    h+=`<button class="add-toggle" data-add-toggle="p" aria-label="${pickerOpen?'Close':'Add scale'}">+</button>`;
  }
  h+=`</div>`;

  // Row 2: scale-name headers
  h+=`<div></div>`;
  for(let ci=0;ci<nCols;ci++){
    const k=order[ci];
    const sc=S[k];
    const words=sc.n.split(' ');
    h+=`<div class="t-hdr" data-k="${k}" data-col-k="${k}" style="view-transition-name:t-hdr-${k}">`;
    h+=`<div class="t-hdr-name" style="color:${scaleColor(k)}">${words.join('<br>')}</div>`;
    h+=`</div>`;
  }

  // Row 3: ⓘ info buttons (no cell emitted for the add column — t-add-hdr covers it)
  h+=`<div></div>`;
  for(let ci=0;ci<nCols;ci++){
    const k=order[ci];
    const sc=S[k];
    if(!sc.ref){ h+=`<div class="t-inf-cell" data-col-k="${k}"></div>`; continue; }
    h+=`<div class="t-inf-cell" data-col-k="${k}"><button class="inf" data-tip="${sc.ref.replace(/"/g,'&quot;')}" aria-label="About ${sc.n}"><span>i</span></button></div>`;
  }

  // Rows 4..15: 12 notes, B -> C
  for(let ni=N.length-1;ni>=0;ni--){
    const note=N[ni];
    h+=`<div class="t-nlbl">${P[note]}</div>`;
    for(let ci=0;ci<nCols;ci++){
      const k=order[ci];
      const sc=S[k],root=roots[k];
      const notes=sn(root,sc.iv);
      const borrowed=getBorrowed(k,root);
      const sc_c=scaleColor(k);

      const inS=notes.includes(note);
      const si=inS?notes.indexOf(note):-1;
      const iv=inS?sc.iv[si]:null;
      const bl=inS&&isBlueNote(iv,k);
      const isR=note===root;
      const isBorrowed=!inS&&borrowed[note]!==undefined;

      if(inS){
        let dotStyle;
        if(bl){
          dotStyle=`background:repeating-linear-gradient(135deg,${sc_c}18,${sc_c}18 2px,${sc_c}40 2px,${sc_c}40 4px);border:1.5px dashed ${sc_c}88`;
        }else if(isR){
          dotStyle=`background:${sc_c}55;border:2px solid ${sc_c}`;
        }else{
          dotStyle=`background:${sc_c}30;border:1px solid ${sc_c}60`;
        }
        const dotCls=isR?'t-dot-root':'t-dot';
        h+=`<div class="t-cell" data-col-k="${k}" data-r="${k}:${note}"><div class="${dotCls}" style="${dotStyle}"></div></div>`;
      }else if(isBorrowed){
        h+=`<div class="t-cell" data-col-k="${k}" data-r="${k}:${note}"><div class="t-dot" style="background:transparent;border:1px dotted ${sc_c}45"></div></div>`;
      }else{
        // Empty cell still carries data-r so tapping any chromatic position
        // re-roots the scale (parity with landscape).
        h+=`<div class="t-cell" data-col-k="${k}" data-r="${k}:${note}"></div>`;
      }
    }
    // No add-column cell — the t-add-hdr spans those rows.
  }

  // Picker pills block in the add column (shared between full render and
  // the togglePicker dom-patch path). Both layouts (grouped + compact) are
  // emitted; CSS on `.t-grid.compact` swaps visibility. updatePickerCompactness()
  // measures after render and toggles the class if grouped would overflow.
  if(pickerOpen || empty){
    h += buildPortraitPickerPills();
    h += buildPortraitPickerPillsFlat();
  }
  h+=`</div>`;
  return h;
}

// Flat fallback: no groups, no labels — all unused pills crammed into a
// single flex-wrapped row filling rows 4..15 of the add column. Used when
// the grouped layout wouldn't fit.
function buildPortraitPickerPillsFlat(){
  const nCols = order.length;
  const addCol = nCols + 2;
  const {groups,byGroup,unusedByGroup,hasAny}=pickerPartition();
  if(!hasAny) return '';
  let h=`<div class="t-pill-flat" style="grid-column:${addCol};grid-row:4 / span 12">`;
  groups.forEach(grp=>{
    for(const k of unusedByGroup.get(grp.g)) h += pillButton(k, true);
  });
  h+=`</div>`;
  return h;
}

// Emits one t-pill-group per picker group, positioned in the add column and
// spanning the 12 note rows proportionally by original group size. Mirrors
// landscape's buildLandscapePickerBody: used scales are filtered out; groups
// with no unused scales collapse but keep their label slot for stable layout.
function buildPortraitPickerPills(){
  const nCols = order.length;
  const addCol = nCols + 2;
  const {groups,byGroup,unusedByGroup,hasAny}=pickerPartition();
  if(!hasAny){
    return `<div class="t-pill-group" style="grid-column:${addCol};grid-row:4 / span 12;text-align:center;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:0.6;font-size:12px">all scales in the tree</div>`;
  }
  const total=12;
  const counts=groups.map(g=>byGroup.get(g.g).length);
  const sum=counts.reduce((a,b)=>a+b,0);
  // Give each group a minimum of 2 rows so even a 2-pill group (Blues)
  // has enough vertical room for its pills' vertical-text labels.
  let spans=counts.map(c=>Math.max(2, Math.round(c/sum*total)));
  let drift=total-spans.reduce((a,b)=>a+b,0);
  let idx=0;
  while(drift!==0){
    spans[idx%spans.length] += drift>0?1:-1;
    drift += drift>0?-1:1;
    idx++;
  }
  let h='';
  let rowStart=4; // row 4 is first note row in the current layout
  groups.forEach((grp,gi)=>{
    const span=spans[gi];
    const unused=unusedByGroup.get(grp.g);
    const dim = unused.length === 0 ? ' dim' : '';
    h+=`<div class="t-pill-group${dim}" style="grid-column:${addCol};grid-row:${rowStart} / span ${span}">`;
    h+=`<div class="t-pill-row">`;
    for(const k of unused) h += pillButton(k, true);
    h+=`</div>`;
    h+=`<div class="t-grp-label">${grp.lbl}</div>`;
    h+=`</div>`;
    rowStart += span;
  });
  return h;
}

// Brightness = flats minus sharps in the formula string. Used for ordering pills within a group.
function brightnessOf(k){
  const f=S[k].f;
  let flats=0, sharps=0;
  for(const ch of f){ if(ch==='♭') flats++; else if(ch==='♯') sharps++; }
  return flats - sharps;
}


function renderInto(app){
  let h='';
  h+=`<div class="desktop-layout">${renderDesktop()}</div>`;
  h+=`<div class="portrait-layout">${renderPortrait()}</div>`;
  app.innerHTML=h;
  updatePickerCompactness();
}

// Measure the grouped portrait picker. If any pill-row is horizontally
// overflowed (more pills than fit side-by-side) or any pill's vertical text
// is being clipped, fall back to the flat/compact layout.
function updatePickerCompactness(){
  const tgrid = document.querySelector('.portrait-layout .t-grid');
  if(!tgrid) return;
  // Only evaluate when picker is actually showing content.
  const rows = tgrid.querySelectorAll('.t-pill-row');
  if(!rows.length){ tgrid.classList.remove('compact'); return; }
  let overflow = false;
  for(const row of rows){
    if(row.scrollWidth > row.clientWidth + 1){ overflow = true; break; }
    for(const pill of row.querySelectorAll('.pill')){
      // vertical-rl text: scrollHeight exceeding clientHeight = clipped text.
      if(pill.scrollHeight > pill.clientHeight + 1){ overflow = true; break; }
    }
    if(overflow) break;
  }
  tgrid.classList.toggle('compact', overflow);
}

// Re-measure on viewport resize since the compact threshold depends on
// available width/height in the add column.
window.addEventListener('resize', ()=>{ updatePickerCompactness(); });

function render(){
  const app=document.getElementById("app");
  // View Transitions API: browser snapshots old DOM, runs the render, and
  // cross-fades / translates between the two states using shared
  // view-transition-name anchors (set on scale rows/cols, pills, etc.).
  // Falls back to a plain render where unsupported.
  if(!document.startViewTransition){
    renderInto(app);
    return;
  }
  // Skip the transition during drag / rapid re-render to avoid jank.
  if(dragState){
    renderInto(app);
    return;
  }
  document.startViewTransition(()=>renderInto(app));
}

/* --- Long-press drag --- */
const LONG_PRESS_MS=350, MOVE_THRESHOLD=6;
let dragState=null;
let suppressClick=false;

function getDraggable(target,isPortrait){
  // Exclude only the picker-side chrome (pills, +/× toggle, picker body).
  // DO include per-scale buttons like .rmv and .inf — pressing on the × or ⓘ
  // long enough to pass LONG_PRESS_MS should still start a drag; a short tap
  // runs the button's action (suppressClick gates that after a drag).
  if(target.closest('.pill')||target.closest('.add-toggle')||target.closest('.row-add')||target.closest('.t-add-hdr')||target.closest('.t-pill-group')||target.closest('.t-pill-flat')) return null;
  if(isPortrait){
    const cell=target.closest('[data-col-k]');
    if(!cell) return null;
    return {key:cell.dataset.colK,axis:'x'};
  }
  const row=target.closest('.row');
  if(!row) return null;
  return {key:row.dataset.k,axis:'y'};
}

function pointerDown(e){
  if(e.button!==undefined&&e.button!==0) return;
  const isPortrait=window.innerWidth<=600;
  const d=getDraggable(e.target,isPortrait);
  if(!d) return;
  dragState={
    mode:'pending',
    key:d.key,
    axis:d.axis,
    startX:e.clientX, startY:e.clientY,
    isPortrait,
    targetIdx:order.indexOf(d.key),
    timer:setTimeout(activateDrag,LONG_PRESS_MS),
  };
}

function activateDrag(){
  if(!dragState||dragState.mode!=='pending') return;
  dragState.mode='active';
  const sel=dragState.isPortrait
    ?`[data-col-k="${dragState.key}"]`
    :`.row[data-k="${dragState.key}"]`;
  const cls=dragState.isPortrait?'t-col-dragging':'dragging';
  document.querySelectorAll(sel).forEach(el=>el.classList.add(cls));
}

function clearIndicators(){
  document.querySelectorAll('.drop-before,.drop-after,.t-col-drop-before,.t-col-drop-after')
    .forEach(el=>el.classList.remove('drop-before','drop-after','t-col-drop-before','t-col-drop-after'));
}

function paintIndicator(idx){
  clearIndicators();
  if(dragState.isPortrait){
    const headers=document.querySelectorAll('.portrait-layout .t-hdr');
    if(idx<headers.length){
      headers[idx].classList.add('t-col-drop-before');
    }else if(headers.length){
      headers[headers.length-1].classList.add('t-col-drop-after');
    }
  }else{
    const rows=document.querySelectorAll('#rows-d > .row');
    if(idx<rows.length){
      rows[idx].classList.add('drop-before');
    }else if(rows.length){
      rows[rows.length-1].classList.add('drop-after');
    }
  }
}

function computeTargetIndex(e){
  const items=dragState.isPortrait
    ?Array.from(document.querySelectorAll('.portrait-layout .t-hdr'))
    :Array.from(document.querySelectorAll('#rows-d > .row'));
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(dragState.isPortrait){
      if(e.clientX<r.left+r.width/2) return i;
    }else{
      if(e.clientY<r.top+r.height/2) return i;
    }
  }
  return items.length;
}

function pointerMove(e){
  if(!dragState) return;
  const dx=e.clientX-dragState.startX;
  const dy=e.clientY-dragState.startY;
  if(dragState.mode==='pending'){
    if(Math.hypot(dx,dy)>MOVE_THRESHOLD){
      clearTimeout(dragState.timer);
      dragState=null;
    }
    return;
  }
  // Active drag
  e.preventDefault();
  const idx=computeTargetIndex(e);
  if(idx!==dragState.targetIdx){
    dragState.targetIdx=idx;
    paintIndicator(idx);
  }
}

function pointerUp(){
  if(!dragState) return;
  if(dragState.mode==='pending'){
    clearTimeout(dragState.timer);
    dragState=null;
    return;
  }
  // Commit
  const fromIdx=order.indexOf(dragState.key);
  let toIdx=dragState.targetIdx;
  if(toIdx==null) toIdx=fromIdx;
  if(toIdx!==fromIdx&&toIdx!==fromIdx+1){
    const[moved]=order.splice(fromIdx,1);
    const adjustedTo=toIdx>fromIdx?toIdx-1:toIdx;
    order.splice(adjustedTo,0,moved);
    saveState();
  }
  clearIndicators();
  dragState=null;
  suppressClick=true;
  setTimeout(()=>{suppressClick=false;},0);
  render();
}

function pointerCancel(){
  if(!dragState) return;
  clearTimeout(dragState.timer);
  if(dragState.mode==='active') clearIndicators();
  dragState=null;
}

document.addEventListener('pointerdown',pointerDown);
document.addEventListener('pointermove',pointerMove,{passive:false});
document.addEventListener('pointerup',pointerUp);
document.addEventListener('pointercancel',pointerCancel);
// Desktop Chrome (incl. DevTools touch emulation) fires `contextmenu` on
// long-press. Suppress it while a drag is pending/active so the press can
// promote to a drag instead of opening the browser menu.
document.addEventListener('contextmenu', e => {
  if(dragState) e.preventDefault();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && pickerOpen){
    togglePicker(false);
  }
});

/* Toggle picker open/closed WITHOUT re-rendering the whole tree, so CSS
   transitions on .row-add / .t-add-hdr actually play on both directions. */
function togglePicker(open){
  pickerOpen = open;
  // Landscape row-add
  const rowAdd = document.querySelector('.desktop-layout .row-add');
  if(rowAdd){
    rowAdd.classList.toggle('expanded', open);
    rowAdd.classList.toggle('collapsed', !open);
    const toggle = rowAdd.querySelector('.add-toggle');
    if(toggle) toggle.setAttribute('aria-label', open?'Close':'Add scale');
    const body = rowAdd.querySelector('.add-body');
    if(body){
      if(open){
        body.innerHTML = buildLandscapePickerBody();
      } else {
        // Keep pill markup during fade-out, then clear on transition end
        setTimeout(()=>{ if(!pickerOpen) body.innerHTML=''; }, 360);
      }
    }
  }
  // Portrait add-hdr + pill groups
  const addHdr = document.querySelector('.portrait-layout .t-add-hdr');
  if(addHdr){
    addHdr.classList.toggle('expanded', open);
    addHdr.classList.toggle('collapsed', !open);
    const toggle = addHdr.querySelector('.add-toggle');
    if(toggle) toggle.setAttribute('aria-label', open?'Close':'Add scale');
    const tgrid = document.querySelector('.portrait-layout .t-grid');
    if(tgrid){
      // Remove existing pill nodes (both grouped and flat).
      tgrid.querySelectorAll('.t-pill-group, .t-pill-flat').forEach(el=>el.remove());
      if(open){
        tgrid.insertAdjacentHTML('beforeend', buildPortraitPickerPills());
        tgrid.insertAdjacentHTML('beforeend', buildPortraitPickerPillsFlat());
        updatePickerCompactness();
      } else {
        tgrid.classList.remove('compact');
      }
    }
  }
}

/* --- Click handling (delegated) --- */
document.addEventListener('click',e=>{
  if(suppressClick){ e.stopPropagation(); e.preventDefault(); return; }

  const rmvBtn=e.target.closest('[data-rmv]');
  if(rmvBtn){
    const k=rmvBtn.dataset.rmv;
    order=order.filter(x=>x!==k);
    // Force picker open when we return to the empty state.
    if(order.length === 0) pickerOpen = true;
    saveState(); render();
    return;
  }
  const addItem=e.target.closest('[data-add]');
  if(addItem){
    const k=addItem.dataset.add;
    if(!order.includes(k)){
      order.push(k);
      if(roots[k]==null) roots[k]=DEFAULTS[k];
    }
    // Keep the picker open — the clicked pill will now render as "used" (dimmed)
    // and the user can continue adding more scales.
    saveState(); render();
    return;
  }
  const addToggle=e.target.closest('[data-add-toggle]');
  if(addToggle){
    togglePicker(!pickerOpen);
    return;
  }
  const noteCell=e.target.closest('[data-r]');
  if(noteCell){
    const[k,n]=noteCell.dataset.r.split(':');
    roots[k]=n; saveState(); render();
    return;
  }
});

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(render,150);
});

applyTheme();
</script>
</body>
</html>
