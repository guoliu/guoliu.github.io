<style class="moss-comments-style">/* ==========================================================================

/* ==========================================================================
   Design Decision Record: Flattened Comment Form
   --------------------------------------------------------------------------

   Research found that the best comment sections treat comments as editorial
   content on the same surface as the article, not as a separate widget.

   Six principles guide the comment form styling:

   P1. One surface
       Remove the tinted card background from .comment-form. Form and
       comments share the page background. Modeled after NYT/Guardian
       "Letters to the Editor" — comments as editorial content, same surface.

   P2. Border language consistency
       Comments use border-bottom: 1px solid. The form uses the same 1px
       border as its boundary, not a background fill + border-radius.

   P3. Typographic continuity
       Placeholder text, field labels, comment body, author names — same
       type family, proportional sizes. Follows iA design philosophy
       (ia.net): "web design is 95% typography", content-first.

   P4. The form is the first comment
       Visually, the compose area reads like an empty comment slot. Same
       padding rhythm, same width, same vertical spacing as comment items.
       Inspired by CSS-Tricks threading (css-tricks.com) — forms inline in
       thread, not separate cards.

   P5. Distinguish through state, not surface
       The textarea is interactive because of cursor/focus behavior, not
       because it sits on a different background. Focus states (accent
       underline) provide sufficient affordance.

   P6. Density matching
       Spacing between form elements echoes spacing between comment items.

   References:
   - NYT/Guardian "Letters to the Editor" model
   - Ahmad Shadeed's comment component (ishadeed.com)
   - CSS-Tricks threading (css-tricks.com)
   - iA design philosophy (ia.net)
   - ResultFirst 2026 trends — "stripping away non-essential frills"
   ========================================================================== */

/* Comment Section — width controlled by site theme (main > .moss-comments) */
.moss-comments {
  margin-top: 6rem;
}

/* Divider above comment section */
.moss-comments > details {
  padding-top: var(--moss-space-lg, 2rem);
  border-top: 1px solid var(--moss-border-light, #e6e2db);
}

/* ==========================================================================
   Collapsible Details/Summary
   ========================================================================== */

.comments-toggle {
  display: flex;
  align-items: center;
  gap: var(--moss-space-xs, 0.5rem);
  cursor: pointer;
  list-style: none;
  font-size: var(--moss-font-sm, 1rem);
  color: var(--moss-color-muted, #8a8580);
  user-select: none;
  padding: 0;
}

/* Hide WebKit default disclosure triangle */
.comments-toggle::-webkit-details-marker {
  display: none;
}

.comments-toggle .comments-icon {
  flex-shrink: 0;
}

.comments-toggle:hover {
  color: var(--moss-color-text, #2c2825);
}

/* Chevron indicator — points right when collapsed, down when expanded */
.comments-toggle .comments-chevron {
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

details[open] > .comments-toggle .comments-chevron {
  transform: rotate(90deg);
}

/* Space between summary and content when open */
details[open] > .comments-toggle {
  margin-bottom: var(--moss-space-md, 1.5rem);
}

/* ==========================================================================
   Comment List
   ========================================================================== */

.comment-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.comment-item {
  padding: var(--moss-space-md, 1.5rem) 0;
  border-bottom: 1px solid var(--moss-border-light, #e6e2db);
}

.comment-item:first-child {
  padding-top: 0;
}

.comment-item:last-child {
  border-bottom: none;
}

/* Comment Header: author name + date */
.comment-header {
  display: flex;
  align-items: baseline;
  gap: var(--moss-space-xs, 0.5rem);
  margin-bottom: var(--moss-space-xs, 0.5rem);
}

.comment-author {
  font-weight: 480;
  font-size: var(--moss-font-sm, 1rem);
  color: var(--moss-color-text, #2c2825);
  text-decoration: none;
}

a.comment-author:hover {
  color: var(--moss-color-accent, #2d5a2d);
}

.comment-date {
  font-size: 0.875rem;
  color: var(--moss-color-muted, #8a8580);
}

/* Comment Body */
.comment-body {
  font-size: var(--moss-font-size, 1.125rem);
  line-height: 1.7;
  color: var(--moss-color-text, #2c2825);
}

.comment-body p {
  margin: 0 0 var(--moss-space-sm, 1rem) 0;
}

.comment-body p:last-child {
  margin-bottom: 0;
}

.comment-body blockquote {
  font-size: inherit;
  font-style: normal;
  border-left: 3px solid var(--moss-color-muted, #8a8580);

  padding-left: var(--moss-space-sm, 1rem);
  color: var(--moss-text-secondary, #5d5853);
}

.comment-body a {
  color: var(--moss-color-text, #2c2825);
  text-decoration: underline;
}

.comment-body a:hover {
  color: var(--moss-color-accent, #2d5a2d);
}

/* ==========================================================================
   Nested Replies — Solid Left Border Threading
   ========================================================================== */

.comment-replies {
  list-style: none;
  padding: 0 0 0 var(--moss-space-sm, 1rem);
  margin: 0 0 0 var(--moss-space-xs, 0.5rem);
  border-left: 2px solid var(--moss-border-medium, #d1cdc4);
}

.comment-replies .comment-item {
  padding: var(--moss-space-sm, 1rem) 0;
}

/* ==========================================================================
   Comment Form
   ========================================================================== */

.comment-form {
  padding: var(--moss-space-md, 1.5rem) 0;
  margin: 0 0 var(--moss-space-md, 1.5rem) 0;
}

/* Textarea — underline style */
.comment-form textarea {
  display: block;
  width: 100%;
  min-height: 3rem;
  padding: 0.25rem 0;
  border: none;
  border-bottom: 1px solid var(--moss-border-medium, #d1cdc4);
  font-family: inherit;
  font-size: var(--moss-font-size, 1.125rem);
  line-height: 1.7;
  color: var(--moss-color-text, #2c2825);
  background: transparent;
  resize: none;
  overflow: hidden;
  box-sizing: border-box;
  transition: border-color 0.15s ease;
}

.comment-form textarea:focus {
  outline: none;
  border-bottom: 2px solid var(--moss-color-accent, #2d5a2d);
}

.comment-form textarea::placeholder {
  color: var(--moss-color-muted, #8a8580);
}

/* ==========================================================================
   Form Meta Row — Name + Email + Website + Submit (single row on desktop)
   ========================================================================== */

.comment-form-meta {
  display: grid;
  grid-template-columns: 1fr 1.3fr 1.1fr auto;
  gap: 0.75rem;
  align-items: end;
  margin-top: var(--moss-space-sm, 1rem);
}

/* Underline-style input fields */
.comment-field {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--moss-border-medium, #d1cdc4);
  padding: 0.5rem 0;
  font-family: inherit;
  font-size: var(--moss-font-sm, 1rem);
  color: var(--moss-color-text, #2c2825);
  box-sizing: border-box;
  transition: border-color 0.15s ease;
  min-width: 0;
}

.comment-field:focus {
  outline: none;
  border-bottom: 2px solid var(--moss-color-accent, #2d5a2d);
}

.comment-field::placeholder {
  color: var(--moss-color-muted, #8a8580);
}

/* ==========================================================================
   Submit Button — Filled Tonal Style
   ========================================================================== */

.comment-form-submit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 1.25rem;
  background: color-mix(in srgb, var(--moss-color-accent, #2d5a2d) 8%, transparent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: var(--moss-color-accent, #2d5a2d);
  font-family: inherit;
  font-size: var(--moss-font-sm, 1rem);
  font-weight: 480;
  transition: background 0.15s ease, color 0.15s ease;
}

.comment-form-submit:hover {
  background: color-mix(in srgb, var(--moss-color-accent, #2d5a2d) 15%, transparent);
}

.comment-form-submit:focus {
  outline: 2px solid var(--moss-color-accent, #2d5a2d);
  outline-offset: 2px;
}

.comment-form-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ==========================================================================
   Accessible Visually Hidden
   ========================================================================== */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ==========================================================================
   Status Messages
   ========================================================================== */

.comment-form-status {
  margin-top: var(--moss-space-sm, 1rem);
  font-size: 0.875rem;
}

.comment-form-status:empty {
  display: none;
}

.comment-form-status--error {
  color: #a83232;
}

.comment-form-status--success {
  color: var(--moss-color-accent, #2d5a2d);
}

/* Default form slot — collapses when form relocates */
.comment-form-slot {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
}
.comment-form-slot--collapsed {
  max-height: 0;
  opacity: 0;
}

/* Reply form wrapper — indented like a reply thread */
.comment-reply-form-wrapper {
  margin-top: var(--moss-space-sm, 1rem);
  padding: var(--moss-space-sm, 1rem) 0 0 var(--moss-space-sm, 1rem);
  margin-left: var(--moss-space-xs, 0.5rem);
  border-left: 2px solid var(--moss-border-medium, #d1cdc4);
  overflow: hidden;
  animation: slideDown 0.25s ease-out;
}

@keyframes slideDown {
  from { max-height: 0; opacity: 0; }
  to { max-height: 500px; opacity: 1; }
}

/* Smaller typography in reply form */
.comment-reply-form-wrapper .comment-form textarea {
  font-size: var(--moss-font-sm, 1rem);
  min-height: 2.5rem;
}
.comment-reply-form-wrapper .comment-field {
  font-size: 0.875rem;
  padding: 0.375rem 0;
}
.comment-reply-form-wrapper .comment-form-submit {

  padding: 0.375rem 1rem;
}
.comment-reply-form-wrapper .comment-form {
  padding-top: 0;
}

  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.8125rem;

.comment-reply-btn:hover {

  border: none;

  }

  .comment-reply-form-wrapper .comment-form-meta {
    grid-template-columns: 1fr 1fr;
  }

/* Full stack on very narrow screens */
@media (max-width: 25rem) {
  .comment-form-meta {
    grid-template-columns: 1fr;
  }

  .comment-form-submit {
    justify-self: end;
  }

  .comment-reply-form-wrapper .comment-form-meta {
    grid-template-columns: 1fr;

  .comment-reply-form-wrapper {
    padding-left: var(--moss-space-xs, 0.5rem);

/* ==========================================================================

.comment-float-shell .comment-form {

/* Dark mode */
[data-theme="dark"] .comment-float-backdrop {

    <div class="comment-form-slot" id="default-form-slot"><form class="comment-form" id="moss-comment-form" data-server-url="https://api.moss.host/comments" data-site-name="liu-guo.com" data-page-key="video/lusheng-yelang/" data-page-title="夜郎谷的芦笙">

    <script>(function() {
  'use strict';
  var form = document.getElementById('moss-comment-form');
  if (!form) return;

  var serverUrl = form.dataset.serverUrl;
  var siteName = form.dataset.siteName;
  var pageKey = form.dataset.pageKey;
  var pageTitle = form.dataset.pageTitle;
  var status = document.getElementById('moss-comment-status');
  var textarea = document.getElementById('moss-comment-text');
  var STORAGE_KEY = 'moss-commenter';
  var replyToId = null;

  // Restore saved identity
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.name) form.querySelector('[name="name"]').value = saved.name;
    if (saved.email) form.querySelector('[name="email"]').value = saved.email;
    if (saved.link) form.querySelector('[name="link"]').value = saved.link;
  } catch(e) {}

  // Auto-grow textarea
  if (textarea) {
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });
  }

  // Reply threading
  document.querySelectorAll('.comment-reply-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = this.dataset.replyId;
      var name = this.dataset.replyName;
      replyToId = id;
      var item = document.getElementById('comment-' + id);
      if (item) {
        var slot = item.querySelector('.comment-replies') || item;
        slot.appendChild(form.parentNode);
      }
      if (textarea) {
        textarea.placeholder = '@' + name + ' ';
        textarea.focus();
      }
    });
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var content = textarea.value.trim();
    if (!content) return;

    var nameVal = form.querySelector('[name="name"]').value.trim();
    var emailVal = form.querySelector('[name="email"]').value.trim();
    var linkVal = form.querySelector('[name="link"]').value.trim();

    if (!nameVal) { status.textContent = 'Name is required'; return; }

    // Save identity
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({name: nameVal, email: emailVal, link: linkVal}));
    } catch(e) {}

    status.textContent = 'Submitting...';
    form.querySelector('[type="submit"]').disabled = true;

    var body = {
      content: content,
      nick: nameVal,
      email: emailVal,
      link: linkVal,
      page_key: pageKey,
      page_title: pageTitle,
      site_name: siteName
    };
    if (replyToId) body.rid = parseInt(replyToId, 10);

    fetch(serverUrl.replace(/\/+$/, '') + '/api/v2/comments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data) {
      status.textContent = 'Comment posted!';
      textarea.value = '';
      replyToId = null;
      // Move form back to default slot
      var defaultSlot = document.getElementById('default-form-slot');
      if (defaultSlot) defaultSlot.appendChild(form.parentNode.contains(form) ? form : form);
      // Insert new comment into DOM
      var list = document.querySelector('.comment-list');
      if (list && data) {
        var li = document.createElement('li');
        li.className = 'comment-item';
        li.innerHTML = '<div class="comment-header"><span class="comment-author">' +
          (nameVal || 'Anonymous') + '</span><time class="comment-date">just now</time></div>' +
          '<div class="comment-body">' + (data.content || content) + '</div>';
        list.appendChild(li);
      }
      setTimeout(function() { status.textContent = ''; }, 3000);
    }).catch(function(err) {
      status.textContent = 'Error: ' + err.message;
    }).finally(function() {
      form.querySelector('[type="submit"]').disabled = false;
    });
  });
})();
</script>
