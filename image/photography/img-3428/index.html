<style class="moss-review-style">/* Review plugin — header and colophon styles
 * Uses moss design tokens. Works in light and dark mode.
 * Side-by-side layout on all screen sizes (matches collection-cover pattern).
 */

/* Header — cover + title/subtitle/creator */
.review-header {
  display: flex;
  gap: var(--moss-space-lg, 2rem);
  align-items: flex-start;
  margin: 1rem 0 2rem;
}

.review-cover {
  width: 150px;
  max-width: 30%;
  height: auto;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
  margin: 0; /* Override global img margin for flex alignment */
}

.review-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.review-meta-title {
  font-weight: 600;
  font-size: 1.05em;
  color: var(--moss-color-text, #333);
}

.review-meta-subtitle {
  font-size: 0.9em;
  color: var(--moss-color-muted, #666);
}

.review-meta-creator {
  font-size: 0.9em;
  color: var(--moss-color-muted, #666);
}

.review-sep {
  color: var(--moss-color-muted, #666);
  margin: 0 0.15em;
}

/* Colophon — card with cover + details */
.review-colophon {
  display: flex;
  gap: var(--moss-space-lg, 2rem);
  align-items: flex-start;
  margin-top: 3rem;
  margin-bottom: 3rem;
  padding: 1.25rem;
  background: var(--moss-color-surface, #f8f8f8);
  border-radius: 8px;
  font-size: 0.9em;
  color: var(--moss-color-muted, #666);
}

.review-colophon-cover {
  width: 150px;
  max-width: 30%;
  height: auto;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
  margin: 0; /* Override global img margin for flex alignment */
}

.review-colophon-details {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.review-colophon-title {
  font-weight: 600;
  color: var(--moss-color-text, #333);
  font-size: 1.05em;
}

.review-colophon-subtitle {
  font-size: 0.9em;
  color: var(--moss-color-muted, #666);
}

.review-colophon-identity {
  font-size: 0.95em;
}

.review-rating {
  font-size: 1.2em;
  color: var(--moss-color-accent, #c9a84c);
  letter-spacing: 0.05em;
}

.review-community-rating {
  font-size: 0.85em;
}

.review-biblio {
  line-height: 1.5;
}

.review-links a {
  color: var(--moss-color-accent, #c9a84c);
  text-decoration: none;
}

.review-links a:hover {
  text-decoration: underline;
}
</style>
<style class="moss-comments-style">/* ==========================================================================
   moss Comments Plugin - Styles

   Collapsible comment section with solid thread borders,
   underline-style form inputs, and responsive grid layout.
   Uses CSS custom properties from moss default.css.
   ========================================================================== */

/* ==========================================================================
   Design Decision Record: Flattened Comment Form
   --------------------------------------------------------------------------

   Research found that the best comment sections treat comments as editorial
   content on the same surface as the article, not as a separate widget.

   Six principles guide the comment form styling:

   P1. One surface
       Remove the tinted card background from .comment-form. Form and
       comments share the page background. Modeled after NYT/Guardian
       "Letters to the Editor" — comments as editorial content, same surface.

   P2. Border language consistency
       Comments use border-bottom: 1px solid. The form uses the same 1px
       border as its boundary, not a background fill + border-radius.

   P3. Typographic continuity
       Placeholder text, field labels, comment body, author names — same
       type family, proportional sizes. Follows iA design philosophy
       (ia.net): "web design is 95% typography", content-first.

   P4. The form is the first comment
       Visually, the compose area reads like an empty comment slot. Same
       padding rhythm, same width, same vertical spacing as comment items.
       Inspired by CSS-Tricks threading (css-tricks.com) — forms inline in
       thread, not separate cards.

   P5. Distinguish through state, not surface
       The textarea is interactive because of cursor/focus behavior, not
       because it sits on a different background. Focus states (accent
       underline) provide sufficient affordance.

   P6. Density matching
       Spacing between form elements echoes spacing between comment items.

   References:
   - NYT/Guardian "Letters to the Editor" model
   - Ahmad Shadeed's comment component (ishadeed.com)
   - CSS-Tricks threading (css-tricks.com)
   - iA design philosophy (ia.net)
   - ResultFirst 2026 trends — "stripping away non-essential frills"
   ========================================================================== */

/* Comment Section — width controlled by site theme.
   The comment toggle becomes the top edge of the footer chrome: it sits with
   generous breathing room below the article body, then the footer divider
   sits a `space-md` (1.5rem) gap below the toggle — mirroring the `space-md`
   gap below the divider before the footer items.
   Selector specificity (main >) is required to win over site.css's
   `main > .moss-comments { margin: 0 auto }` rule, which would otherwise
   reset margin-top to 0 and erase the breathing room. */
main > .moss-comments {
  margin-top: 6rem;
}

/* When .moss-comments is the last child of main (no series-nav between it
   and the footer), retune the gap between main and the footer divider so
   the toggle sits as part of the footer chrome:
     - `main { padding-bottom: 60px }` — drop entirely; .moss-comments owns
       its own top breathing room (margin-top above) and the toggle should
       sit directly above the footer's standoff.
     - `footer.container { margin-top: 5rem }` — replace with `space-md` so
       the toggle→divider gap mirrors the divider→items gap (also `space-md`,
       see `footer.container::before { margin-bottom: var(--moss-space-md) }`
       in site.css). Footer items are visually heavier (larger font), so an
       optically symmetric gap settles to numerically equal here.
   When series-nav follows comments, neither override fires — the series-nav
   owns the visual separation and the default footer margin (5rem) carries
   the breathing room above the footer divider. */
main:has(> .moss-comments:last-child) {
  padding-bottom: 0;
}
main:has(> .moss-comments:last-child) + footer.container {
  margin-top: var(--moss-space-md);
}

/* ==========================================================================
   Collapsible Details/Summary
   ========================================================================== */

.comments-toggle {
  display: flex;
  align-items: center;
  gap: var(--moss-space-xs, 0.5rem);
  cursor: pointer;
  list-style: none;
  font-size: var(--moss-font-sm, 1rem);
  color: var(--moss-color-muted, #8a8580);
  user-select: none;
  padding: 0;
}

/* Hide WebKit default disclosure triangle */
.comments-toggle::-webkit-details-marker {
  display: none;
}

.comments-toggle .comments-icon {
  flex-shrink: 0;
}

.comments-toggle:hover {
  color: var(--moss-color-text, #2c2825);
}

/* Chevron indicator — points right when collapsed, down when expanded */
.comments-toggle .comments-chevron {
  flex-shrink: 0;
  transition: transform 0.2s ease;
}

details[open] > .comments-toggle .comments-chevron {
  transform: rotate(90deg);
}

/* Space between summary and content when open */
details[open] > .comments-toggle {
  margin-bottom: var(--moss-space-md, 1.5rem);
}

/* ==========================================================================
   Comment List
   ========================================================================== */

.comment-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.comment-item {
  padding: var(--moss-space-md, 1.5rem) 0;
  border-bottom: 1px solid var(--moss-border-light, #e6e2db);
}

.comment-item:first-child {
  padding-top: 0;
}

.comment-item:last-child {
  border-bottom: none;
}

/* Comment Header: author name + date */
.comment-header {
  display: flex;
  align-items: baseline;
  gap: var(--moss-space-xs, 0.5rem);
  margin-bottom: var(--moss-space-xs, 0.5rem);
}

.comment-author {
  font-weight: 480;
  font-size: var(--moss-font-sm, 1rem);
  color: var(--moss-color-text, #2c2825);
  text-decoration: none;
}

a.comment-author:hover {
  color: var(--moss-color-accent, #2d5a2d);
}

.comment-date {
  font-size: 0.875rem;
  color: var(--moss-color-muted, #8a8580);
}

/* Comment Body */
.comment-body {
  font-size: var(--moss-font-size, 1.125rem);
  line-height: 1.7;
  color: var(--moss-color-text, #2c2825);
}

.comment-body p {
  margin: 0 0 var(--moss-space-sm, 1rem) 0;
}

.comment-body p:last-child {
  margin-bottom: 0;
}

.comment-body blockquote {
  font-size: inherit;
  font-style: normal;
  border-left: 3px solid var(--moss-color-muted, #8a8580);
  margin: var(--moss-space-xs, 0.5rem) 0 var(--moss-space-xs, 0.5rem) 1rem;
  padding-left: var(--moss-space-sm, 1rem);
  color: var(--moss-text-secondary, #5d5853);
}

.comment-body a {
  color: var(--moss-color-text, #2c2825);
  text-decoration: underline;
}

.comment-body a:hover {
  color: var(--moss-color-accent, #2d5a2d);
}

/* ==========================================================================
   Nested Replies — Solid Left Border Threading
   ========================================================================== */

.comment-replies {
  list-style: none;
  padding: 0 0 0 var(--moss-space-sm, 1rem);
  margin: 0 0 0 var(--moss-space-xs, 0.5rem);
  border-left: 2px solid var(--moss-border-medium, #d1cdc4);
}

.comment-replies .comment-item {
  padding: var(--moss-space-sm, 1rem) 0;
}

/* ==========================================================================
   Comment Form
   ========================================================================== */

.comment-form {
  padding: var(--moss-space-md, 1.5rem) 0;
  margin: 0 0 var(--moss-space-md, 1.5rem) 0;
}

/* Textarea — underline style */
.comment-form textarea {
  display: block;
  width: 100%;
  min-height: 3rem;
  padding: 0.25rem 0;
  border: none;
  border-bottom: 1px solid var(--moss-border-medium, #d1cdc4);
  font-family: inherit;
  font-size: var(--moss-font-size, 1.125rem);
  line-height: 1.7;
  color: var(--moss-color-text, #2c2825);
  background: transparent;
  resize: none;
  overflow: hidden;
  box-sizing: border-box;
  transition: border-color 0.15s ease;
}

.comment-form textarea:focus {
  outline: none;
  border-bottom: 2px solid var(--moss-color-accent, #2d5a2d);
}

.comment-form textarea::placeholder {
  color: var(--moss-color-muted, #8a8580);
}

/* ==========================================================================
   Form Meta Row — Name + Email + Website + Submit (single row on desktop)
   ========================================================================== */

.comment-form-meta {
  display: grid;
  grid-template-columns: 1fr 1.3fr 1.1fr auto;
  gap: 0.75rem;
  align-items: end;
  margin-top: var(--moss-space-sm, 1rem);
}

/* Underline-style input fields */
.comment-field {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--moss-border-medium, #d1cdc4);
  padding: 0.5rem 0;
  font-family: inherit;
  font-size: var(--moss-font-sm, 1rem);
  color: var(--moss-color-text, #2c2825);
  box-sizing: border-box;
  transition: border-color 0.15s ease;
  min-width: 0;
}

.comment-field:focus {
  outline: none;
  border-bottom: 2px solid var(--moss-color-accent, #2d5a2d);
}

.comment-field::placeholder {
  color: var(--moss-color-muted, #8a8580);
}

/* ==========================================================================
   Submit Button — Filled Tonal Style
   ========================================================================== */

.comment-form-submit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 1.25rem;
  background: color-mix(in srgb, var(--moss-color-accent, #2d5a2d) 8%, transparent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: var(--moss-color-accent, #2d5a2d);
  font-family: inherit;
  font-size: var(--moss-font-sm, 1rem);
  font-weight: 480;
  transition: background 0.15s ease, color 0.15s ease;
}

.comment-form-submit:hover {
  background: color-mix(in srgb, var(--moss-color-accent, #2d5a2d) 15%, transparent);
}

.comment-form-submit:focus {
  outline: 2px solid var(--moss-color-accent, #2d5a2d);
  outline-offset: 2px;
}

.comment-form-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ==========================================================================
   Accessible Visually Hidden
   ========================================================================== */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ==========================================================================
   Status Messages
   ========================================================================== */

.comment-form-status {
  margin-top: var(--moss-space-sm, 1rem);
  font-size: 0.875rem;
}

.comment-form-status:empty {
  display: none;
}

.comment-form-status--error {
  color: #a83232;
}

.comment-form-status--success {
  color: var(--moss-color-accent, #2d5a2d);
}

/* Default form slot — collapses when form relocates */
.comment-form-slot {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
}
.comment-form-slot--collapsed {
  max-height: 0;
  opacity: 0;
}

/* Reply form wrapper — indented like a reply thread */
.comment-reply-form-wrapper {
  margin-top: var(--moss-space-sm, 1rem);
  padding: var(--moss-space-sm, 1rem) 0 0 var(--moss-space-sm, 1rem);
  margin-left: var(--moss-space-xs, 0.5rem);
  border-left: 2px solid var(--moss-border-medium, #d1cdc4);
  overflow: hidden;
  animation: slideDown 0.25s ease-out;
}

@keyframes slideDown {
  from { max-height: 0; opacity: 0; }
  to { max-height: 500px; opacity: 1; }
}

/* Smaller typography in reply form */
.comment-reply-form-wrapper .comment-form textarea {
  font-size: var(--moss-font-sm, 1rem);
  min-height: 2.5rem;
}
.comment-reply-form-wrapper .comment-field {
  font-size: 0.875rem;
  padding: 0.375rem 0;
}
.comment-reply-form-wrapper .comment-form-submit {
  font-size: 0.875rem;
  padding: 0.375rem 1rem;
}
.comment-reply-form-wrapper .comment-form {
  padding-top: 0;
}

/* Reply button in comment header */
.comment-reply-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.8125rem;
  color: var(--moss-color-muted, #8a8580);
  padding: 0;
  margin-left: auto;
  transition: color 0.15s ease;
}
.comment-reply-btn:hover {
  color: var(--moss-color-accent, #2d5a2d);
}

/* Reply indicator */
.comment-reply-indicator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--moss-color-muted, #8a8580);
  margin-bottom: var(--moss-space-xs, 0.5rem);
}
.comment-reply-indicator strong {
  color: var(--moss-color-text, #2c2825);
  font-weight: 480;
}
.comment-reply-cancel {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--moss-color-muted, #8a8580);
  font-size: 0.875rem;
  padding: 0;
  margin-left: 0.25rem;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.comment-reply-cancel:hover {
  color: var(--moss-color-text, #2c2825);
}

/* ==========================================================================
   Responsive
   ========================================================================== */

/* 2+2 layout: name+email on row 1, website+button on row 2 */
@media (max-width: 37.5rem) {
  .comment-form-meta {
    grid-template-columns: 1fr 1fr;
  }

  .comment-replies {
    padding-left: var(--moss-space-xs, 0.5rem);
    margin-left: 0.25rem;
  }

  .comment-reply-form-wrapper .comment-form-meta {
    grid-template-columns: 1fr 1fr;
  }
}

/* Full stack on very narrow screens */
@media (max-width: 25rem) {
  .comment-form-meta {
    grid-template-columns: 1fr;
  }

  .comment-form-submit {
    justify-self: end;
  }

  .comment-reply-form-wrapper .comment-form-meta {
    grid-template-columns: 1fr;
  }
  .comment-reply-form-wrapper {
    padding-left: var(--moss-space-xs, 0.5rem);
    margin-left: 0.25rem;
  }
}

/* ==========================================================================
   Float shell — quote-aware comment flow
   ========================================================================== */

.comment-float-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.08);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 1999;
}
.comment-float-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

.comment-float-shell {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--moss-color-bg, #faf8f5);
  border-top: 1px solid var(--moss-border-light, #e6e2db);
  z-index: 2000;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.comment-float-shell.open {
  transform: translateY(0);
}
.comment-float-inner {
  max-width: 38em;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 3rem;
}

.comment-float-quote {
  padding-left: 0.75rem;
  border-left: 2px solid var(--moss-color-accent, #2d5a2d);
  margin-bottom: 1.25rem;
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--moss-text-secondary, #5d5853);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Float shell form: remove its own border-top since the shell provides it */
.comment-float-shell .comment-form {
  border-top: none;
  padding-top: 0;
  margin: 0;
}

/* Dark mode */
[data-theme="dark"] .comment-float-backdrop {
  background: rgba(0, 0, 0, 0.35);
}
</style>
<style class="moss-email-style">@layer shortcodes {
  /* Email subscribe form — injected by email plugin enhance hook.
     The footer form sits in slot:footer-end, AFTER the default link list
     (design B, 2026-05-06). Spacing between the form and the link list
     above it is provided by the flex `gap` on `footer.container` when
     the default-shape footer rule kicks in (see site.css
     `footer.container:has(> p.footer-default + ...)`). No margin-top
     here — it would compound the gap when wrapped, and the side-by-side
     layout doesn't want one at all. */
  .moss-subscribe-form[data-position="footer"] {
    display: flex;
    gap: var(--moss-space-sm);
    align-items: baseline;
    max-width: 24rem;
  }

  .moss-subscribe-form[data-position="footer"] .moss-input {
    flex: 1;
  }

  .moss-subscribe-form[data-position="footer"] .moss-btn {
    font-size: inherit;
  }

  @media (max-width: 48rem) {
    .moss-subscribe-form[data-position="footer"] {
      max-width: none;
    }

    .moss-subscribe-form[data-position="footer"] .moss-input {
      flex: 1;
      min-width: 0;
    }
  }

  /* Inline `:::subscribe` shortcode wrapper.
     Card-styled container for in-page subscribe forms. Token-only; no
     hardcoded colors. See spec
     docs/superpowers/specs/2026-04-30-subscribe-shortcode-design.md. */
  .moss-subscribe {
    max-width: 32rem;
    margin: var(--moss-space-lg) 0;
    padding: var(--moss-space-md) var(--moss-space-lg);
    border: 1px solid var(--moss-border-light);
    border-radius: var(--moss-radius-md, 0.5rem);
  }

  .moss-subscribe-description {
    margin: 0 0 var(--moss-space-md) 0;
    color: var(--moss-color-muted);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .moss-subscribe-form[data-position="inline"] {
    display: flex;
    gap: var(--moss-space-sm);
    align-items: baseline;
  }

  .moss-subscribe-form[data-position="inline"] .moss-input {
    flex: 1;
    min-width: 0;
  }

  @media (max-width: 32rem) {
    .moss-subscribe-form[data-position="inline"] {
      flex-direction: column;
      align-items: stretch;
    }
    .moss-subscribe-form[data-position="inline"] .moss-btn {
      width: 100%;
    }
  }
}
</style>
